name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run data validation
        run: python validate_data.py data/sample_employees.csv

      - name: Train model and generate artefact
        run: python src/train_model.py

      - name: Check model artefact exists
        run: test -f model/promotion_model.pkl

      - name: Run tests
        run: pytest tests/ -v

      - name: Check dashboard compiles
        run: python -m py_compile dashboard/app.py
